<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>照合モード | 蔵書管理</title>
<meta name="theme-color" content="#203A2D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">

  <header class="top-bar">
    <div class="top-bar-title">
      <span class="mark">蔵</span>
      <div>
        <p class="title-main">照合モード</p>
        <p class="title-sub" id="syncStatus">同期状況を確認中…</p>
      </div>
    </div>
    <div class="top-bar-actions">
      <button id="modeToggleBtn" class="mode-toggle" title="テキスト検索に切り替え">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="settingsBtn" class="mode-toggle" title="データ元の設定">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- 初回設定 / データ元設定パネル -->
  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-card">
      <p class="settings-title">データ元の設定</p>
      <p class="settings-desc">
        PCの画面で「スマホ用データを同期」を押すと表示されるURLを、ここに貼り付けてください。
        PCが起動していなくても、このURLさえあれば照合できます。
      </p>
      <input id="snapshotUrlInput" type="text" placeholder="https://gist.githubusercontent.com/...">
      <div class="settings-actions">
        <button id="settingsCancelBtn" class="btn-ghost-mobile">キャンセル</button>
        <button id="settingsSaveBtn" class="btn-start">保存して同期</button>
      </div>
      <p id="settingsError" class="settings-error"></p>
    </div>
  </div>

  <!-- カメラスキャン画面 -->
  <section id="scanMode" class="mode-panel is-active">
    <div class="camera-frame">
      <div id="reader"></div>
      <div class="camera-guide"></div>
    </div>

    <button id="startCameraBtn" class="btn-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M7 6v12M11 6v12M15 6v12" stroke="currentColor" stroke-width="1.4"/></svg>
      カメラを起動してスキャン開始
    </button>

    <div class="manual-entry">
      <input id="manualIsbnInput" type="text" inputmode="numeric" placeholder="バーコードが読めない場合はISBNを入力">
      <button id="manualCheckBtn">照合</button>
    </div>
  </section>

  <!-- テキスト検索画面(ISBNなし本向け) -->
  <section id="textMode" class="mode-panel">
    <p class="mode-desc">同人誌など、バーコードのない本はタイトル・サークル名で検索できます。</p>
    <div class="manual-entry">
      <input id="textSearchInput" type="text" placeholder="タイトル・サークル名を入力">
      <button id="textSearchBtn">検索</button>
    </div>
    <div id="textSearchResults" class="text-search-results"></div>
  </section>

  <!-- 判定結果 -->
  <div id="resultOverlay" class="result-overlay" hidden>
    <div id="resultCard" class="result-card">
      <div id="resultIcon" class="result-icon"></div>
      <p id="resultHeadline" class="result-headline"></p>
      <p id="resultTitle" class="result-title"></p>
      <p id="resultSub" class="result-sub"></p>
      <div id="resultVolumes" class="result-volumes"></div>
      <button id="resultCloseBtn" class="btn-resume">次をスキャン</button>
    </div>
  </div>

  <!-- スキャン履歴 -->
  <section class="history-section">
    <p class="history-heading">最近の照合履歴</p>
    <div id="historyList" class="history-list">
      <p class="history-empty">まだ履歴がありません</p>
    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="matching.js"></script>
<script src="app.js"></script>
</body>
</html>
